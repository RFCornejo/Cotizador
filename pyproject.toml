[project]
name = "preciario-app"
version = "1.0.0"
description = "Preciario de Mantenimientos Toyota"
requires-python = ">=3.9"

dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "xlsxwriter>=3.1.0",
    "pillow>=9.0.0",
    "pyarrow>=14.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
